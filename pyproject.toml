[project]
name = "elevate-hr-agent"
version = "1.0.0"
description = "Project Elevate: Enterprise HR & IT Agentic Solution built with Google ADK, FastMCP, Model Armor, and Vertex AI Search RAG."
requires-python = ">=3.11, <3.14"
dependencies = [
    "google-adk",
    "google-genai",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "pytest>=8.0.0",
    # Retrieval against the deployed Vertex AI Search datastore.
    "google-cloud-discoveryengine>=0.13.0",
    # Required by --trace_to_cloud. Without it the Cloud Run container exits
    # with ModuleNotFoundError before binding the port, and the deploy fails
    # on a health-check timeout that names neither the module nor the flag.
    "opentelemetry-exporter-otlp>=1.25.0",
    "google-cloud-logging>=3.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
